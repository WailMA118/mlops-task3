[project]
name = "olist-late-delivery"
version = "0.1.0"
description = "Late-delivery prediction inference service (MLOps Task 3)"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["notebooks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=src --cov=app --cov-report=term-missing"
pythonpath = ["."]

[tool.coverage.run]
source = ["src", "app"]
omit = ["*/__init__.py"]
