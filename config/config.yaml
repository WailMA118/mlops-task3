# =============================================================================
# olist-late-delivery — central configuration
# Every path and parameter used by src/ and app/ must come from this file.
# Override any value with an environment variable named CONFIG__<UPPER__PATH>,
# e.g. CONFIG__DATABASE__URL, handled in src/utils/config.py.
# =============================================================================

project:
  name: "olist-late-delivery"
  random_state: 42

database:
  # Overridden in containers via env var DATABASE_URL (see src/utils/config.py)
  url: "postgresql://mlops:mlops@localhost:5433/olist"

paths:
  data:
    raw_dir: "data/raw"
    interim_dir: "data/interim"
    processed_dir: "data/processed"
    ml_table: "data/interim/ml_orders_dataset.parquet"
    ml_table_labeled: "data/interim/ml_orders_labeled.parquet"
    train: "data/processed/train.parquet"
    val: "data/processed/val.parquet"
    test: "data/processed/test.parquet"
    feature_table_train: "data/processed/feature_table_train.parquet"
    feature_table_val: "data/processed/feature_table_val.parquet"
    feature_table_test: "data/processed/feature_table_test.parquet"
  artifacts:
    feature_engineering_dir: "models/feature_engineering_artifacts"
    numeric_imputer: "models/feature_engineering_artifacts/numeric_imputer.joblib"
    onehot_encoder: "models/feature_engineering_artifacts/onehot_encoder.joblib"
    payment_encoder: "models/feature_engineering_artifacts/payment_encoder.joblib"
    same_state_fill_value: "models/feature_engineering_artifacts/same_state_fill_value.joblib"
    feature_list_raw: "models/feature_engineering_artifacts/feature_list_raw.json"
    final_feature_list: "models/feature_engineering_artifacts/final_feature_list.json"
  model:
    model_dir: "models/model_artifacts"
    final_model: "models/model_artifacts/final_model_random_forest.joblib"
    model_config: "models/model_artifacts/final_model_config.json"
    results_summary: "models/model_artifacts/results_summary.csv"
    feature_importances: "models/model_artifacts/feature_importances.csv"
  eda:
    report_dir: "reports/eda"
    numerical_distributions_plot: "reports/eda/numerical_distributions_and_outliers.png"
    relations_and_correlations_plot: "reports/eda/relations_and_correlations.png"
    date_analysis_plot: "reports/eda/date_analysis.png"
    geography_analysis_plot: "reports/eda/geography_analysis.png"
    categorical_summary: "reports/eda/categorical_summary.csv"
    messy_values: "reports/eda/messy_values.csv"
    numeric_summary: "reports/eda/numeric_summary.csv"
    missing_summary: "reports/eda/missing_summary.csv"
    status_relation: "reports/eda/status_relation.csv"
    payment_relation: "reports/eda/payment_relation.csv"
    status_label_crosstab: "reports/eda/status_label_crosstab.csv"
    correlation_matrix: "reports/eda/correlation_matrix.csv"
    distance_late_rate: "reports/eda/distance_late_rate.csv"
    distance_corr: "reports/eda/distance_corr.csv"
    feature_selection: "reports/eda/feature_selection.csv"
    findings_summary: "reports/eda/findings_summary.txt"

split:
  test_size: 0.30
  val_ratio_of_temp: 0.50
  stratify_column: "is_late"

target:
  column: "is_late"

features:
  window_days: 5
  numeric_features:
    - "total_price"
    - "total_freight"
    - "num_items"
    - "num_sellers"
    - "num_products"
    - "total_weight"
    - "num_payment_sequential"
    - "avg_distance_km"
    - "max_distance_km"
    - "purchase_month"
    - "customer_state_pressure_5d"
    - "seller_pressure_5d"
  categorical_single_features:
    - "customer_state"
    - "purchase_weekday"
  multi_value_feature: "payment_types"
  boolean_features:
    - "same_state"
    - "is_holiday"

eda:
  # Where Notebook 4's analysis (task2nb4.ipynb -> src/pipeline/eda.py) writes
  # its plots, summary CSVs, and findings.
  report_dir: "reports/eda"
  # Which split the EDA runs against. train.parquet only, by design (nb4 never
  # opens val/test) — matches split.<key> under paths.data.
  input_split: "train"
  # Semantic type of every column the EDA touches, so numeric/categorical/date
  # handling never hardcodes a column list in code. Extend when new columns
  # are added upstream (Notebook 1/2/5) rather than editing src/pipeline/eda.py.
  column_types:
    order_id: "id"
    customer_id: "id"
    customer_unique_id: "id"
    order_status: "categorical"
    payment_types: "categorical"
    customer_city: "categorical"
    customer_state: "categorical"
    customer_zip_code_prefix: "categorical"
    seller_states: "categorical"
    seller_zip_codes: "categorical"
    order_purchase_timestamp: "date"
    order_approved_at: "date"
    order_delivered_carrier_date: "date"
    order_delivered_customer_date: "date"
    order_estimated_delivery_date: "date"
    total_price: "numerical"
    total_freight: "numerical"
    num_items: "numerical"
    num_sellers: "numerical"
    num_products: "numerical"
    total_weight: "numerical"
    num_photos: "numerical"
    avg_distance_km: "numerical"
    max_distance_km: "numerical"
    min_distance_km: "numerical"
    total_payment_value: "numerical"
    num_payment_sequential: "numerical"
    is_late: "numerical"
  # Columns whose missingness has a known real-world cause (used to annotate
  # the missing-value report instead of leaving it as an unexplained number).
  meaningful_missing_columns:
    order_approved_at: "Order not approved."
    order_delivered_carrier_date: "Order not shipped."
    total_price: "Order has no item records."
    total_freight: "Order has no item records."
    num_items: "Order has no item records."
    num_sellers: "Order has no seller records."
    num_products: "Order has no product records."
    total_weight: "Product weight not recorded."
    num_photos: "Product photo count not recorded."
    avg_distance_km: "Seller/customer distance unavailable."
    max_distance_km: "Seller/customer distance unavailable."
    min_distance_km: "Seller/customer distance unavailable."
  # Columns treated as non-negative in the raw-range sanity check (substring
  # match against the column name, same rule Notebook 4 used).
  non_negative_keywords:
    - "price"
    - "freight"
    - "items"
    - "payment"
    - "weight"
    - "photos"
    - "seller"
    - "product"
    - "distance"
  outlier_iqr_multiplier: 1.5
  rare_category_threshold: 0.01
  top_categories_to_plot: 15
  min_state_orders_for_ranking: 20
  distance_bucket_edges: [-1, 0, 100, 500, 1000, 2000, 10000]
  distance_bucket_labels: ["0", "0-100", "100-500", "500-1000", "1000-2000", "2000+"]

model:
  algorithm: "random_forest"
  tuning_metric: "f1"
  decision_threshold: 0.5
  class_weight: "balanced"
  param_grid:
    n_estimators: [200, 400]
    max_depth: [null, 10, 20]
    min_samples_leaf: [1, 5, 10]

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "olist-late-delivery"
  registered_model_name: "olist-late-delivery-rf"
  registry_stage: "Production"

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  log_dir: "logs"
  app_log_file: "logs/app.log"
  predictions_log_file: "logs/predictions.log"

validation:
  # Great Expectations behavior when a batch fails its expectation suite
  on_failure: "reject"   # one of: reject | flag | default
  suite_dir: "great_expectations"

api:
  host: "0.0.0.0"
  port: 8000
  title: "Olist Late Delivery Prediction API"
  version: "0.1.0"